name: envman-compose-ci
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Hub (avoids 10/hr/IP limit)
        uses: docker/login-action@v3
        with: {username: ${{ secrets.DOCKERHUB_USERNAME }}, password: ${{ secrets.DOCKERHUB_TOKEN }}}
        # rate limits: https://www.docker.com/pricing/faq/
      - name: Compose up with health wait
        run: |
          docker compose up -d --wait --wait-timeout 120
          # --wait waits for running|healthy: https://docs.docker.com/reference/cli/docker/compose/up/
          docker compose ps; docker ps --format '{{.Names}} {{.Status}}'
      - name: Verifier probes (pg_isready + redis PING + ES curl)
        run: |
          ./harvest/healthcheck_examples/postgres.sh mydb || docker logs mydb --tail 100
          ./harvest/healthcheck_examples/redis.sh myredis || docker logs myredis --tail 100
      - name: Pytest (unit, mocked docker)
        run: |
          pip install pytest
          pytest harvest/tests/mock_docker_shim.py backend/tests -q
      - name:Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Cleanup (remove orphans + volumes guard)
        if: always()
        run: docker compose down --remove-orphans
